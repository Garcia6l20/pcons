# Test configuration for the multi-ABI Qt Android APK example

[test]
description = "One Qt Quick application packaged for two Android ABIs in one APK: a mapping of ABI to environment, a primary ABI, and both application libraries staged into one androiddeployqt output directory"

expected_outputs = [
    "build/android-arm64-v8a/libqtapp.so",
    "build/android-x86_64/libqtapp.so",
    "build/android-arm64-v8a/android-deployment-settings.json",
    "build/android-arm64-v8a/qtapp/libs/arm64-v8a/libqtapp_arm64-v8a.so",
    "build/android-arm64-v8a/qtapp/libs/x86_64/libqtapp_x86_64.so",
    "build/android-arm64-v8a/qtapp/androiddeployqt.stamp",
]

[skip]
# macOS and Windows runners ship an NDK and set the same variables, so the
# environment check alone would let this run where it has never been tried.
platforms = ["windows", "darwin"]
# Two Qt installs built for Android, one per ABI. Nothing probes for either:
# the host Qt on PATH answers every discovery question first.
require_env = [
    "ANDROID_NDK_HOME",
    "ANDROID_HOME",
    "PCONS_QT_ANDROID_ROOT",
    "PCONS_QT_ANDROID_ROOT_X86_64",
]
requires = ["clang", "file"]
generators = ["make", "xcode"]

[verify]
commands = [
    # Each ABI really was cross-compiled for itself. One environment building
    # both would produce two identical files and a package that runs on one.
    { run = "file build/android-arm64-v8a/qtapp/libs/arm64-v8a/libqtapp_arm64-v8a.so", expect_stdout = "ARM aarch64" },
    { run = "file build/android-arm64-v8a/qtapp/libs/x86_64/libqtapp_x86_64.so", expect_stdout = "x86-64" },
    # Seven keys are maps of ABI to value; x86_64 appearing in the file at all
    # is what tells the second environment reached it.
    { run = "cat build/android-arm64-v8a/android-deployment-settings.json", expect_stdout = "x86_64-linux-android" },
    # The primary ABI is named on its own, not replaced by the map.
    { run = "cat build/android-arm64-v8a/android-deployment-settings.json", expect_stdout = "\"abi\": \"arm64-v8a\"" },
]
